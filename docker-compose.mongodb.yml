services:
  mongodb:
    image: mongo:8.0.5
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: 179fc_mms_local
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - 179fc-mongodb-data:/data/db

volumes:
  179fc-mongodb-data:
