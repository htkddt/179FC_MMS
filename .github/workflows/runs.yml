name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI
    uses: ./.github/workflows/backend-ci.yml

  frontend:
    name: Frontend CI
    uses: ./.github/workflows/frontend-ci.yml
